name: ci
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Release authorization regression tests (isolated fixtures)
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          for script in scripts/auto-ship.sh scripts/notify-tom.sh scripts/install-auto-ship.sh; do
            bash -n "$script"
          done
  meisterkit:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native package tests (no simulator or signing)
        run: swift test --package-path Packages/MeisterKit
      - name: Release guard tests on macOS
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
